<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#4b48d6"/>
      <stop offset="100%" stop-color="#6e6bff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="18%" cy="22%" r="55%">
      <stop offset="0%" stop-color="#6e6bff" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6e6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="88%" cy="90%" r="50%">
      <stop offset="0%" stop-color="#4b48d6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#4b48d6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7c7d9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#08080b"/>
  <rect width="1200" height="630" fill="url(#glowA)"/>
  <rect width="1200" height="630" fill="url(#glowB)"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#6e6bff" stroke-width="1">
    <line x1="0" y1="157" x2="1200" y2="157"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="473" x2="1200" y2="473"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
  </g>

  <!-- Border frame -->
  <rect x="40" y="40" width="1120" height="550" rx="24" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Logo: olivo minimalista -->
  <g transform="translate(100,75) scale(4.5) translate(-16,-12.5)">
    <ellipse cx="16" cy="12.5" rx="10" ry="8.5" fill="#c4a052"/>
    <rect x="14.5" y="20.5" width="3" height="7.5" rx="1.5" fill="#c4a052"/>
  </g>

  <!-- Handle -->
  <text x="220" y="140" font-family="'Courier New',monospace" font-size="26" font-weight="700" fill="#8b88ff" letter-spacing="1">Guarina0x0</text>
  <text x="221" y="172" font-family="'Courier New',monospace" font-size="17" fill="#7a7a90" letter-spacing="1">// Offensive Security</text>

  <!-- Name -->
  <text x="100" y="360" font-family="'Helvetica Neue',Arial,sans-serif" font-size="82" font-weight="700" fill="url(#nameGrad)" letter-spacing="-2">Antonio Gallego López</text>

  <!-- Role line -->
  <text x="103" y="418" font-family="'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="500" fill="#a8a8bd">Pentester · Mobile &amp; Web Security</text>

  <!-- Cert chips -->
  <g font-family="'Courier New',monospace" font-size="19" font-weight="700">
    <rect x="100" y="470" width="104" height="46" rx="11" fill="#16161d" stroke="#6e6bff" stroke-opacity="0.35"/>
    <text x="152" y="500" fill="#8b88ff" text-anchor="middle">CRTE</text>
    <rect x="216" y="470" width="100" height="46" rx="11" fill="#16161d" stroke="#6e6bff" stroke-opacity="0.35"/>
    <text x="266" y="500" fill="#8b88ff" text-anchor="middle">CRTO</text>
    <rect x="328" y="470" width="110" height="46" rx="11" fill="#16161d" stroke="#6e6bff" stroke-opacity="0.35"/>
    <text x="383" y="500" fill="#8b88ff" text-anchor="middle">CARTP</text>
    <rect x="450" y="470" width="96" height="46" rx="11" fill="#16161d" stroke="#6e6bff" stroke-opacity="0.35"/>
    <text x="498" y="500" fill="#8b88ff" text-anchor="middle">CWP</text>
    <rect x="558" y="470" width="150" height="46" rx="11" fill="#16161d" stroke="#ffffff" stroke-opacity="0.12"/>
    <text x="633" y="500" fill="#7a7a90" text-anchor="middle">+3 más</text>
  </g>

  <!-- URL -->
  <text x="1100" y="500" font-family="'Courier New',monospace" font-size="20" fill="#6e6bff" text-anchor="end" letter-spacing="1">guarina0x0.github.io</text>
